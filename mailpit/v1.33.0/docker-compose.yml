services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8025"
      - "${PANEL_APP_PORT_SMTP}:1025"
    volumes:
      - ./data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

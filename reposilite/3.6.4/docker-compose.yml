services:
  reposilite:
    image: dzikoysk/reposilite:3.6.4
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      REPOSILITE_OPTS: "--port 8080"
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
